name: Actualizar Cotizaciones Diarias

on:
  # Ejecutar todos los días a las 20:00 hora Argentina (23:00 UTC)
  schedule:
    - cron: '0 23 * * *'
  
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  actualizar-historico:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del repositorio
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      # 3. Ejecutar script para guardar cotizaciones
      - name: Guardar cotizaciones del día
        run: node guardar-cotizaciones.js
      
      # 4. Configurar Git
      - name: Configurar Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
      
      # 5. Commit y push de cambios
      - name: Commit y push
        run: |
          git add historico.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Actualizar cotizaciones - $(date +'%d/%m/%Y %H:%M')" && git push)
