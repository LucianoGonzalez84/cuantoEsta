name: Actualizar cotizaciones dolar

on:
  schedule:
    - cron: "*/5 * * * *" # cada 5 minutos
  workflow_dispatch: # permite ejecutarlo manual

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Obtener datos de la API
        run: |
          curl -s https://cuanto-esta.vercel.app/api/dolares > data.json

      - name: Actualizar historico.json
        run: |
          node <<EOF
          const fs = require('fs');

          const nuevo = JSON.parse(fs.readFileSync('data.json', 'utf-8'));

          const path = 'historico.json';
          let historico = { ultimas_cotizaciones: [] };

          if (fs.existsSync(path)) {
              historico = JSON.parse(fs.readFileSync(path, 'utf-8'));
          }

          historico.ultimas_cotizaciones.push(nuevo);

          // mantener solo últimos 100 registros
          historico.ultimas_cotizaciones = historico.ultimas_cotizaciones.slice(-100);

          fs.writeFileSync(path, JSON.stringify(historico, null, 2));
          EOF

      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add historico.json
          git commit -m "update cotizaciones" || echo "No changes"
          git push
