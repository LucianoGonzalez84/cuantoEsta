name: Actualizar Cotizaciones Diarias
 
on:
  # Ejecutar todos los días a las 23:59 hora Argentina (02:59 UTC del día siguiente)
  schedule:
    - cron: '59 2 * * *'
  
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:
 
jobs:
  actualizar-historico:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Guardar cotizaciones del día
        run: node guardar-cotizaciones.js
      
      - name: Configurar Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
      
      - name: Commit y push
        run: |
          git add historico.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Actualizar cotizaciones - $(date +'%d/%m/%Y %H:%M')" && git push)
 
