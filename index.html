<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Cuánto Está el Dólar Hoy? | CuantoEsta.ar</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --celeste: #0EA5E9;
            --verde: #10B981;
            --rojo: #EF4444;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text: #0F172A;
            --shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Work Sans', sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 50px; }
        header { background: white; padding: 1.5rem; border-bottom: 3px solid var(--celeste); text-align: center; margin-bottom: 2rem; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 15px; }

        /* Grid de Tarjetas */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .card { 
            background: var(--card-bg); border-radius: 20px; padding: 1.5rem; 
            box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
        }
        .card-title { font-size: 0.9rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-price { font-family: 'Sora', sans-serif; font-size: 2.5rem; font-weight: 800; margin: 0.5rem 0; }
        
        /* Contenedores de Gráficos */
        .sparkline-container { width: 100%; height: 80px; margin-top: 10px; }
        .main-chart-container { 
            background: white; border-radius: 24px; padding: 1.5rem; 
            box-shadow: var(--shadow); height: 350px; margin-top: 20px;
        }

        /* Variaciones */
        .badge { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; }
        .up { background: rgba(16, 185, 129, 0.1); color: var(--verde); }
        .down { background: rgba(239, 68, 68, 0.1); color: var(--rojo); }

        h2 { font-family: 'Sora', sans-serif; font-weight: 800; margin-bottom: 1.5rem; font-size: 1.75rem; }

        @media (max-width: 600px) {
            .card-price { font-size: 2rem; }
            .main-chart-container { height: 280px; padding: 10px; }
        }
    </style>
</head>
<body>

<header>
    <h1 style="font-family: 'Sora'; font-weight: 800; color: var(--celeste);">💵 Cuánto<span>Está</span></h1>
</header>

<div class="container">
    <div class="grid" id="prices-grid">
        <div class="card">
            <div class="card-title">Dólar Blue</div>
            <div class="card-price" id="blue-price">$---</div>
            <div id="blue-var" class="badge">--%</div>
            <div class="sparkline-container"><canvas id="blue-spark"></canvas></div>
        </div>
        <div class="card">
            <div class="card-title">Dólar Oficial</div>
            <div class="card-price" id="oficial-price">$---</div>
            <div id="oficial-var" class="badge">--%</div>
            <div class="sparkline-container"><canvas id="oficial-spark"></canvas></div>
        </div>
        <div class="card">
            <div class="card-title">Dólar MEP</div>
            <div class="card-price" id="mep-price">$---</div>
            <div id="mep-var" class="badge">--%</div>
            <div class="sparkline-container"><canvas id="mep-spark"></canvas></div>
        </div>
    </div>

    <h2>📈 Evolución Semanal</h2>
    <div class="main-chart-container">
        <canvas id="mainChart"></canvas>
    </div>
</div>

<script>
    // Configuración de Estilo para Chart.js
    Chart.defaults.font.family = "'Work Sans', sans-serif";
    Chart.defaults.color = '#94a3b8';

    async function init() {
        const hist = await fetch('https://raw.githubusercontent.com/LucianoGonzalez84/cuantoEsta/main/historico.json').then(r => r.json());
        const data = hist.ultimas_cotizaciones;
        const labels = data.map(d => new Date(d.fecha).toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'}));

        // 1. Actualizar Precios y Variaciones
        const hoy = data[data.length-1];
        const ayer = data[data.length-2];

        updateCard('blue', hoy.blue.venta, ayer.blue.venta);
        updateCard('oficial', hoy.oficial.venta, ayer.oficial.venta);
        updateCard('mep', hoy.mep.venta, ayer.mep.venta);

        // 2. Crear Sparklines (los chiquitos)
        renderSparkline('blue-spark', data.map(d => d.blue.venta), varColor(hoy.blue.venta, ayer.blue.venta));
        renderSparkline('oficial-spark', data.map(d => d.oficial.venta), varColor(hoy.oficial.venta, ayer.oficial.venta));
        renderSparkline('mep-spark', data.map(d => d.mep.venta), varColor(hoy.mep.venta, ayer.mep.venta));

        // 3. Gráfico Principal (con onda)
        renderMainChart('mainChart', labels, data);
    }

    function updateCard(id, hoy, ayer) {
        document.getElementById(`${id}-price`).textContent = '$' + hoy.toLocaleString('es-AR');
        const diff = ((hoy - ayer) / ayer * 100).toFixed(2);
        const el = document.getElementById(`${id}-var`);
        el.textContent = (diff >= 0 ? '▲ ' : '▼ ') + Math.abs(diff) + '%';
        el.className = 'badge ' + (diff >= 0 ? 'up' : 'down');
    }

    function varColor(h, a) { return h >= a ? '#10B981' : '#EF4444'; }

    function renderSparkline(canvasId, dataset, color) {
        new Chart(document.getElementById(canvasId), {
            type: 'line',
            data: {
                labels: dataset,
                datasets: [{
                    data: dataset,
                    borderColor: color,
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: true,
                    backgroundColor: (ctx) => {
                        const gradient = ctx.chart.ctx.createLinearGradient(0, 0, 0, 80);
                        gradient.addColorStop(0, color + '33');
                        gradient.addColorStop(1, color + '00');
                        return gradient;
                    },
                    tension: 0.4
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });
    }

    function renderMainChart(id, labels, data) {
        const ctx = document.getElementById(id).getContext('2d');
        const blueGrad = ctx.createLinearGradient(0, 0, 0, 400);
        blueGrad.addColorStop(0, '#0EA5E933');
        blueGrad.addColorStop(1, '#0EA5E900');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Dólar Blue',
                        data: data.map(d => d.blue.venta),
                        borderColor: '#0EA5E9',
                        backgroundColor: blueGrad,
                        fill: true,
                        tension: 0.4,
                        borderWidth: 4,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#0EA5E9',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    },
                    {
                        label: 'Dólar Oficial',
                        data: data.map(d => d.oficial.venta),
                        borderColor: '#10B981',
                        tension: 0.4,
                        borderWidth: 2,
                        pointRadius: 0,
                        borderDash: [5, 5]
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top', align: 'end', labels: { boxWidth: 10, usePointStyle: true } },
                    tooltip: {
                        backgroundColor: '#0F172A',
                        padding: 12,
                        titleFont: { size: 14, weight: 'bold' },
                        cornerRadius: 12,
                        displayColors: false
                    }
                },
                scales: {
                    y: { grid: { color: '#f1f5f9' }, ticks: { callback: v => '$' + v } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    init();
</script>

</body>
</html>
